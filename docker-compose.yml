version: '3.8'
services:
  web:
    build: .
    command: poetry run python manage.py runserver 0.0.0.0:8000
    volumes:
      - app_data:/app
    ports:
      - "8000:8000"
    env_file:
      - env.dev
    depends_on:
      - db
    networks:
      - backend
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bookstore_dev
      POSTGRES_PASSWORD: bookstore_dev
      POSTGRES_DB: bookstore_dev_db
    networks:
      - backend

volumes:
  postgres_data:
  app_data:

networks:
  backend:
    driver: bridge
