

[tool.poetry]
name = "bookstore"
version = "0.1.0"
description = "Backend Django para Bookstore com Docker e Postgres"
authors = ["Fryansb <seu@email.com>"]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
django = "^6.0.1"
djangorestframework = "^3.16.1"
psycopg2-binary = "^2.9"
factory-boy = "^3.3.3"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.0"
black = "^24.3"
mypy = "^1.8"
autopep8 = "^2.0"
isort = "^5.13"
pytest = "^9.0.2"
pytest-django = "^4.8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


